name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lawncare
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: lawn_care
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations against a fresh database
        working-directory: backend
        run: alembic upgrade head

      - name: Lint with ruff
        working-directory: backend
        run: pip install ruff && ruff check .

      - name: Start app and verify /health and /login respond
        working-directory: backend
        env:
          DATABASE_URL: postgresql://lawncare:localdevpassword@localhost:5432/lawn_care
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          uvicorn app.main:app &
          sleep 2
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "owner@lawncare.local", "password": "wrongpassword"}' \
            -o /dev/null -w "%{http_code}" | grep -q 401
          kill %1

      - name: Set up test database
        working-directory: backend
        run: |
          PGPASSWORD=localdevpassword psql -h localhost -U lawncare -d lawn_care -c "CREATE DATABASE lawn_care_test;"
          PGPASSWORD=localdevpassword psql -h localhost -U lawncare -d lawn_care_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          DATABASE_URL=postgresql://lawncare:localdevpassword@localhost:5432/lawn_care_test alembic upgrade head

      - name: Run pytest
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-not-for-production
        run: pytest -v
