name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lawncare
          POSTGRES_PASSWORD: localdevpassword
          POSTGRES_DB: lawn_care
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations against a fresh database
        working-directory: backend
        run: alembic upgrade head

      - name: Create a test user for CI auth checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql://lawncare:localdevpassword@localhost:5432/lawn_care
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          python3 -c "
          from app.db.session import SessionLocal
          from app.db.base import User
          from app.core.security import hash_password

          db = SessionLocal()
          user = User(email='ci@lawncare.local', password_hash=hash_password('ci-test-password'), name='CI Test User')
          db.add(user)
          db.commit()
          db.close()
          "

      - name: Lint with ruff
        working-directory: backend
        run: pip install ruff && ruff check .


      - name: Start app and verify /health and /login respond
        working-directory: backend
        env:
          DATABASE_URL: postgresql://lawncare:localdevpassword@localhost:5432/lawn_care
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          uvicorn app.main:app &
          sleep 2
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "owner@lawncare.local", "password": "wrongpassword"}' \
            -o /dev/null -w "%{http_code}" | grep -q 401
          curl --fail -X POST http://localhost:8000/api/v1/leads \
            -H "Content-Type: application/json" \
            -d '{"name": "CI Test", "email": "ci@example.com", "phone": null, "address": "1 CI Way", "message": null}'
          curl -X GET http://localhost:8000/api/v1/leads \
            -o /dev/null -w "%{http_code}" | grep -q 401
          TOKEN=$(curl --fail -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "ci@lawncare.local", "password": "ci-test-password"}' \
            | jq -r .access_token)
          LEAD_ID=$(curl --fail -X POST http://localhost:8000/api/v1/leads \
            -H "Content-Type: application/json" \
            -d '{"name": "Convert Me", "email": "convert@example.com", "phone": null, "address": "2 CI Way", "message": null}' \
            | jq -r .id)
          curl --fail -X POST "http://localhost:8000/api/v1/leads/00000000-0000-0000-0000-000000000000/convert" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o /dev/null -w "%{http_code}" | grep -q 404
          curl --fail -X POST "http://localhost:8000/api/v1/leads/${LEAD_ID}/convert" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o /dev/null -w "%{http_code}" | grep -q 201
          curl -X POST "http://localhost:8000/api/v1/leads/${LEAD_ID}/convert" \
            -H "Authorization: Bearer ${TOKEN}" \
            -o /dev/null -w "%{http_code}" | grep -q 409
          kill %1
